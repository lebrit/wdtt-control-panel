name: Panel checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Get official WDTT sources for patch regression
        run: git clone --depth 1 --branch v1.4.3 https://github.com/SpaceNeuroX/proxy-turn-vk-android.git /tmp/qwdtt
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Python regression tests
        env:
          QWDTT_SOURCE: /tmp/qwdtt
        run: python3 -m unittest discover -s tests
      - name: Shell and JavaScript syntax
        run: |
          for script in bootstrap.sh install.sh update.sh uninstall.sh; do bash -n "$script"; done
          node --check wdtt_panel/static/app.js
      - name: Real systemd socket and readonly namespace regression
        run: sudo env WDTT_SYSTEMD_TEST=1 python3 -m unittest discover -s tests -p test_systemd_transport.py -v
      - name: Compile and test the patched WDTT server
        if: ${{ !cancelled() }}
        run: |
          python3 wdtt_panel/wdtt_server_patch.py /tmp/qwdtt
          cd /tmp/qwdtt
          go test -mod=mod ./server
          go build -mod=mod -o /tmp/wdtt-ci-server ./server
